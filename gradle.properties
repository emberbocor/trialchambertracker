org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# Minecraft 26.2 has no hotfix releases.
minecraft_version=26.2
minecraft_version_range=[26.2]
minecraft_label=26.2
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2
neo_version=26.2.0.93
# The lowest NeoForge version the mod declares support for: the first 26.2 build (first stable: 26.2.0.57).
# Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=26.2.0.0-beta"
neo_version_range=[26.2.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Fabric. The jar is compiled against minecraft_version and supports Minecraft 26.2 only.
# Verify the minimum with: ./gradlew :fabric:compileJava "-Pfabric_api_version=0.152.1+26.2" "-Pfabric_loader_version=0.18.4"
fabric_loader_version=0.20.1
# Minimum Fabric Loader, the one the minimum Fabric API requires.
fabric_loader_version_range=>=0.18.4
# Fabric API is required for its resource loader (lang files). Not used in code.
fabric_api_version=0.161.0+26.2
# Minimum Fabric API, the first build for the 26.2 release (earlier +26.2 builds target snapshots/prereleases).
# Build metadata (+26.2) is ignored when Fabric compares versions.
fabric_api_version_range=>=0.152.1
fabric_minecraft_version_range=26.2

# Forge 65 is the series for 26.2.
# Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=65.0.0"
forge_version=65.1.5
forge_version_range=[65.0.0,)
forge_loader_version_range=[65,)

mod_id=trialchambertracker
mod_name=Trial Chamber Tracker
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.trialchambertracker
