org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# Minecraft 26.3 has no hotfix releases.
minecraft_version=26.3
minecraft_version_range=[26.3]
minecraft_label=26.3
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
neo_version=26.3.0.99
# The lowest NeoForge version the mod declares support for: the first 26.3 build (first stable: 26.3.0.76).
# Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=26.3.0.0-beta"
neo_version_range=[26.3.0.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Fabric. The jar is compiled against minecraft_version and supports Minecraft 26.3 only.
# Verify the minimum with: ./gradlew :fabric:compileJava "-Pfabric_api_version=0.160.5+26.3" "-Pfabric_loader_version=0.19.3"
fabric_loader_version=0.20.1
# Minimum Fabric Loader, the one the minimum Fabric API requires.
fabric_loader_version_range=>=0.19.3
# Fabric API is required for its resource loader (lang files). Not used in code.
fabric_api_version=0.165.0+26.3
# Minimum Fabric API, the first build for the 26.3 release (earlier +26.3 builds target snapshots/release candidates).
# Build metadata (+26.3) is ignored when Fabric compares versions.
fabric_api_version_range=>=0.160.5
fabric_minecraft_version_range=26.3

# Forge 66 is the series for 26.3.
# Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=66.0.0"
forge_version=66.1.0
forge_version_range=[66.0.0,)
forge_loader_version_range=[66,)

mod_id=trialchambertracker
mod_name=Trial Chamber Tracker
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.trialchambertracker
